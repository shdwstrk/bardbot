services:
  bardbot:
    image: shdwstrk/bardbot
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?Set DISCORD_TOKEN in .env or the shell environment}
      OLLAMA_HOST: ${OLLAMA_HOST:-ollama}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-360}
      OLLAMA_AUTO_PULL: ${OLLAMA_AUTO_PULL:-true}
      OLLAMA_STARTUP_TIMEOUT_SECONDS: ${OLLAMA_STARTUP_TIMEOUT_SECONDS:-120}
      OLLAMA_PULL_TIMEOUT_SECONDS: ${OLLAMA_PULL_TIMEOUT_SECONDS:-3600}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:latest}
    volumes:
      - ./recordings:/app/recordings
      - ./transcripts:/app/transcripts
    depends_on:
      ollama:
        condition: service_started
    networks:
      - bardbot
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - bardbot
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  bardbot:
    name: bardbot-network
    driver: bridge

volumes:
  ollama_data:
